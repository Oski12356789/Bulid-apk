
name: Godot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'gra.zip'
      - '**/gra.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Pobranie repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Znalezienie i rozpakowanie gry
      - name: Extract Godot game
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "gra.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Nie znaleziono gra.zip"
            exit 1
          fi

          mkdir -p game
          unzip -o "$ZIP_FILE" -d game

          PROJECT_FILE=$(find game -type f \
            -name "project.godot" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Nie znaleziono project.godot"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projekt: $PROJECT_DIR"

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # 5. Instalacja wymaganych pakietów Android
      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Pobranie Godot 4.7.2
      - name: Download Godot
        shell: bash
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip -d godot

          chmod +x godot/Godot_v4.7.2-stable_linux.x86_64

          echo "GODOT_BIN=$GITHUB_WORKSPACE/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      # 7. Szablony eksportu
      - name: Download Android export templates
        shell: bash
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -O templates.tpz

          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          unzip -q templates.tpz \
            -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          if [ -d "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates" ]; then
            mv "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates/"* \
              "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
            rmdir "$HOME/.local/share/godot/export_templates/4.7.2.stable/templates"
          fi

      # 8. Konfiguracja SDK i Javy dla Godot
      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      # 9. Ustawienia tekstur
      - name: Prepare Godot project
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          project = os.environ["PROJECT_DIR"]
          path = os.path.join(project, "project.godot")

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          setting = "textures/vram_compression/import_etc2_astc=true"

          if "[rendering]" in content:
              if "textures/vram_compression/import_etc2_astc" not in content:
                  content = content.replace(
                      "[rendering]",
                      "[rendering]\n" + setting,
                      1
                  )
          else:
              content += "\n[rendering]\n" + setting + "\n"

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Ustawienia projektu przygotowane.")
          PY

      # 10. Tworzenie presetu Android
      - name: Create Android export preset
        shell: bash
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/game.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          package/unique_name="com.example.game"
          package/name="Godot Game"
          EOF

      # 11. Import projektu
      - name: Import Godot project
        shell: bash
        run: |
          "$GODOT_BIN" --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      # 12. Eksport APK
      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/build"
          mkdir -p "$GITHUB_WORKSPACE/build"

          "$GODOT_BIN" --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/game.apk"

          if [ ! -f "$PROJECT_DIR/build/game.apk" ]; then
            echo "ERROR: APK nie został utworzony!"
            exit 1
          fi

          cp "$PROJECT_DIR/build/game.apk" \
            "$GITHUB_WORKSPACE/build/game.apk"

          echo "APK utworzony poprawnie."

      # 13. Udostępnienie APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Godot-Android-APK
          path: build/game.apk
          if-no-files-found: error
          retention-days: 30
