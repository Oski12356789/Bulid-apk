
name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack game ZIP
        shell: bash
        run: |
          echo "Searching for game ZIP..."
          find . -type f -iname "*.zip"

          ZIP_FILE=$(find . -type f -iname "gra.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: gra.zip not found!"
            exit 1
          fi

          mkdir -p game
          unzip -q "$ZIP_FILE" -d game

          PROJECT_FILE=$(find game -type f -name "project.godot" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable"

          wget -q "$GODOT_URL/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip

          sudo install -m 755 \
            Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot

      - name: Install Godot export templates
        shell: bash
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable"

          wget -q "$GODOT_URL/Godot_v4.7.2-stable_export_templates.tpz"

          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable

          unzip -q -j \
            Godot_v4.7.2-stable_export_templates.tpz \
            'templates/*' \
            -d ~/.local/share/godot/export_templates/4.7.2.stable

      - name: Create Android export preset
        shell: bash
        run: |
          cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/game.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          gradle_build/export_format=0
          gradle_build/min_sdk="23"
          gradle_build/target_sdk="35"
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          EOF

      - name: Import Godot project
        run: |
          godot --headless --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p "$PROJECT_DIR/build"

          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/game.apk"

      - name: Verify APK
        run: |
          test -s "$PROJECT_DIR/build/game.apk"
          ls -lh "$PROJECT_DIR/build/game.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lesna-Przygoda-APK
          path: game/**/*.apk
          if-no-files-found: error
          retention-days: 14
